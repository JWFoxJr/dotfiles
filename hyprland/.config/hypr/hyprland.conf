# Joe's Hyprland config
# Managed by dotfiles + GNU Stow:
#   stow --target=$HOME hyprland waybar

$mod = SUPER
$term = ghostty
$menu = rofi -show drun
$font = JetBrainsMono Nerd Font

# Tokyo Night-ish colours, matching the i3 config.
$bg = rgb(1a1b26)
$bg_alt = rgb(24283b)
$fg = rgb(c0caf5)
$fg_dim = rgb(565f89)
$blue = rgb(7aa2f7)
$purple = rgb(bb9af7)
$red = rgb(f7768e)
$yellow = rgb(e0af68)

monitor=,preferred,auto,1

# Startup. Keep wallpaper out for now: Ghostty is currently carrying Cerevyn_Business.png.
exec-once = waybar
exec-once = nm-applet --indicator

# Hyprland visual treatment: clean i3, but with Wayland polish.
general {
    gaps_in = 4
    gaps_out = 6
    border_size = 2
    col.active_border = $blue $purple 45deg
    col.inactive_border = $bg_alt
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    animation = windows,1,2,easeOutQuint
    animation = border,1,3,easeOutQuint
    animation = fade,1,2,easeOutQuint
    animation = workspaces,1,2,easeOutQuint
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

# Launchers / terminals.
bind = $mod, Return, exec, $term
bind = $mod SHIFT, Return, exec, $term -e tmux new -A -s main
bind = $mod, D, exec, $menu
bind = $mod SHIFT, D, exec, rofi -show run

# Window focus: vim-style and arrows.
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, Left, movefocus, l
bind = $mod, Down, movefocus, d
bind = $mod, Up, movefocus, u
bind = $mod, Right, movefocus, r

# Move windows.
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Down, movewindow, d
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Right, movewindow, r

# Layout.
bind = $mod, B, togglesplit
bind = $mod, V, togglesplit
bind = $mod, F, fullscreen
bind = $mod, S, pseudo
bind = $mod, W, togglegroup
bind = $mod, E, layoutmsg, togglesplit
bind = $mod SHIFT, Space, togglefloating
bind = $mod, Space, cyclenext
bind = $mod, A, layoutmsg, focusmaster

# Resize mode equivalent: hold Mod+R and use vim/arrows.
bind = $mod, R, submap, resize
submap = resize
bind = , H, resizeactive, -10 0
bind = , J, resizeactive, 0 10
bind = , K, resizeactive, 0 -10
bind = , L, resizeactive, 10 0
bind = , Left, resizeactive, -10 0
bind = , Down, resizeactive, 0 10
bind = , Up, resizeactive, 0 -10
bind = , Right, resizeactive, 10 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mod, R, submap, reset
submap = reset

# Workspaces. Waybar renders the i3-like labels.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Screenshots and utilities.
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, N, exec, $term -e nmtui
bind = $mod, P, exec, pavucontrol
bind = $mod SHIFT, M, exec, nwg-displays

# Media keys. pactl is provided by the PulseAudio-compatible PipeWire stack.
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Session control.
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, E, exec, ~/.config/waybar/scripts/power-menu

# Floating hints for utility windows.
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = float,class:^(org.gnome.Nautilus)$,title:^(Properties)$

# Configure True Colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'
set -ga terminal-overrides ',*:smcup@:rmcup@'
set -g allow-passthrough on

# Status bar at top of screen
set-option -g status-position top
set -g display-time 2000

# Set tmux history to unlimited
set -g history-limit 1000000

# Enable the mouse in tmux
set -g mouse on

# Renumber panes dynamically
set-option -g renumber-windows on

# Change default tmux prefix to "Ctrl-A
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Add keybind for eaily refreshing tmux configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

# Change keybinds for splitting windows
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# Add keybinds for easily resizing tmux panes
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Add keybind for maximizing and minimizing tmux pane
bind -r m resize-pane -Z

# Configure vim movements for tmux's copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start slecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# Keybind for 65%/35% verical split, 75%/25% horizontal split
bind-key W new-window -n workbench \; \
           split-window -h -p 30 \; \
           split-window -v -p 25 \; \
           select-pane -t :.0

# tpm plugin
# TPM location override
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restarts
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# Plugin settings
set -g @resurrect-capture-pane-contents 'on' # allow tmux-resurrect to capture pane contents
set -g @continuum-restore 'on' # allow tmux-continuum functionality

# Theme settings

# PowerKit theme/plugin - https://github.com/fabioluciano/tmux-powerkit
# This is a very powerful set of plugins and themes, but I prefer simplicity
set -g @plugin 'fabioluciano/tmux-powerkit'
# Basic configuration

# 3-element orders enable CENTERED layout:
set -g @powerkit_status_order "session,plugins"  # session LEFT, windows CENTER, plugins RIGHT
set -g @powerkit_plugins "group(git, gitlab),ssh,group(temperature,sysstatus,uptime),hostname"
set -g @powerkit_plugin_group_coloring "true"
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"
set -g @powerkit_separator_style "normal"
set -g @powerkit_elements_spacing "both"
set -g @powerkit_plugin_git_show_branch "true"
set -g @powerkit_plugin_git_show_files "true"
# GitLab configuration
set -g @powerkit_plugin_gitlab_url "https://foundry1.tenno.jwfoxjr.com"
set -g @powerkit_plugin_gitlab_repos "tennolab/infrastructure/dotfiles,tennolab/web/aj0ef-blog"
set -g @powerkit_plugin_gitlab_token "glpat--3RMojORf6BIiwqe0gu8Dm86MQp1OjMH.01.0w18a8tr5"  # Or use env vars
# Gitlab  Display options
set -g @powerkit_plugin_gitlab_show_issues "false"
set -g @powerkit_plugin_gitlab_show_mrs "true"
set -g @powerkit_plugin_gitlab_separator " | "
# set -g @powerkit_status_interval "3600"

# =============================================================================
# PLUGIN: ssh
# =============================================================================

# Display format
# Values:
#   "auto"      - Auto-detect and show user@host
#   "host"      - Show host only
#   "user"      - Show user only
#   "indicator" - Show text indicator only
set -g @powerkit_plugin_ssh_format "auto"

# Text for indicator format
set -g @powerkit_plugin_ssh_text "SSH"

# Detection mode
# Values:
#   "session" - Check if tmux session is via SSH
#   "pane"    - Check if current pane is SSH
#   "current" - Check current shell process
set -g @powerkit_plugin_ssh_detection_mode "current"

# Show plugin when not in SSH session
# Values: "true", "false"
set -g @powerkit_plugin_ssh_show_when_local "false"

# Display components (when format=auto)
# Values: "true", "false"
set -g @powerkit_plugin_ssh_show_user "true"
set -g @powerkit_plugin_ssh_show_host "true"

# Icon
set -g @powerkit_plugin_ssh_icon "󰣀"

# Cache TTL in seconds
set -g @powerkit_plugin_ssh_cache_ttl "1"

# Cache TTL in seconds
set -g @powerkit_plugin_wifi_cache_ttl "1"

# Start tpm
run '~/.config/tmux/plugins/tpm/tpm'

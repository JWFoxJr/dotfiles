# Configure True Colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'
set -ga terminal-overrides ',*:smcup@:rmcup@'
set -g allow-passthrough on

# Status bar at top of screen
set-option -g status-position top
set -g display-time 2000

# Set tmux history to unlimited
set -g history-limit 1000000

# Enable the mouse in tmux
set -g mouse on

# Renumber panes dynamically
set-option -g renumber-windows on

# Change default tmux prefix to "Ctrl-A
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Add keybind for eaily refreshing tmux configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

# Change keybinds for splitting windows
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# Add keybinds for easily resizing tmux panes
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Add keybind for maximizing and minimizing tmux pane
bind -r m resize-pane -Z

# Configure vim movements for tmux's copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start slecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restarts
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# Plugin settings
set -g @resurrect-capture-pane-contents 'on' # allow tmux-resurrect to capture pane contents
set -g @continuum-restore 'on' # allow tmux-continuum functionality

# Theme settings

# Tokyo Night tmux theme (Alejandro Amaral)
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @tokyo-night-tmux_theme night 		# storm | day | default set to 'night'
set -g @tokyo-night-tmux_transparent 0		# 0 or 1
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare

# Icon Styles
set -g @tokyo-night-tmux_terminal_icon 
set -g @tokyo-night-tmux_active_terminal_icon 

# No extra space between icons
set -g @tokyo-night-tmux_window_tidy_icons 1

# Battery widget
set -g @tokyo-night-tmux_show_battery_widget 1
set -g @tokyo-night-tmux_battery_name 'BAT0' 	# some linux distros have 'BAT0'
set -g @tokyo-night-tmux_battery_low_threshold 21 #default

# Date/Time widget
set -g @tokyo-night-tmux_date_format MDY
set -g @tokyo-night-tmux_time_format 24H

# Hostname widget
set -g @tokyo-night-tmux_show_hostname 1

# File path widget
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative  # relative or absolute

# Network widget
set -g @tokyo-night-tmux_show_netspeed 1
set -g @tokyo-night-tmux_netspeed_iface 'protea'  # Can be omitted, picked up from default route
set -g @tokyo-night-tmux_netspeed_show_ip 1
set -g @tokyo-night-tmux_netspeed_refresh 1

# Now Playing widget
set -g @tokyo-night-tmux_show_music 1	# Handled by playerctl (Linux) or nowplaying-cli (MacOS)

#set -g @plugin 'catppuccin/tmux#v2.1.3' # See https://github.com/catppuccin/tmux/tags for additional tags

# Start tpm
run '~/.tmux/plugins/tpm/tpm'

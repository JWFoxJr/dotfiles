# Configure True Colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'
set -ga terminal-overrides ',*:smcup@:rmcup@'
set -g allow-passthrough on

# Status bar at top of screen
set-option -g status-position top
set -g display-time 2000

# Set tmux history to unlimited
set -g history-limit 1000000

# Enable the mouse in tmux
set -g mouse on

# Renumber panes dynamically
set-option -g renumber-windows on

# Change default tmux prefix to "Ctrl-A
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Add keybind for eaily refreshing tmux configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

# Change keybinds for splitting windows
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# Add keybinds for easily resizing tmux panes
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Add keybind for maximizing and minimizing tmux pane
bind -r m resize-pane -Z

# Configure vim movements for tmux's copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start slecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# tpm plugin
# TPM location override
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restarts
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# Plugin settings
set -g @resurrect-capture-pane-contents 'on' # allow tmux-resurrect to capture pane contents
set -g @continuum-restore 'on' # allow tmux-continuum functionality

# Theme settings

# Catppuccin tmux theme settings

# Make the status line pretty and add some modules
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style 'rounded'
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ''
set -ag status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_application}'
set -agF status-right '#{E:@catppuccin_status_cpu}'
set -agF status-right '#{E:@catppuccin_status_battery}'
set -ag status-right '#{E:@catppuccin_status_uptime}'
set -g @catppuccin_window_text '#T'
set -g @catppuccin_window_current_text '#T'

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-battery/battery.tmux

# Start tpm
run '~/.config/tmux/plugins/tpm/tpm'
